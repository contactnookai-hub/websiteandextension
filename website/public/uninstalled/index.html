<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sorry to see you go | Nook</title>
  <meta name="description" content="Tell us why you uninstalled Nook." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#2f80d8" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0c1a30; --muted: #55657f; --line: rgba(18, 44, 88, 0.12);
      --sky-1: #2a76cf; --sky-2: #3f8fe0; --sky-3: #79b8f0; --sky-4: #c4e0fa;
      --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font: 16px/1.55 var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden;
      background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 38%, var(--sky-3) 72%, var(--sky-4) 100%);
      min-height: 100vh;
    }
    .rays { position: fixed; inset: 0; pointer-events: none; background:
      radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,0.28), transparent 70%),
      linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.08) 46%, transparent 52%),
      linear-gradient(75deg, transparent 55%, rgba(255,255,255,0.06) 60%, transparent 66%); }
    .mountains { position: fixed; left: 0; right: 0; bottom: 0; height: 38vh; pointer-events: none; }
    .mountains img { position: absolute; left: 50%; bottom: 0; width: max(1400px, 120vw); transform: translateX(-50%); }
    .mountains .far { opacity: 0.55; bottom: 6vh; }
    .mountains .mid { opacity: 0.8; bottom: 2vh; }
    main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 56px 18px 120px; text-align: center; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font: 400 26px/1 var(--serif); }
    .brand img { width: 34px; height: 34px; filter: drop-shadow(0 6px 14px rgba(5, 20, 50, 0.35)); }
    h1 { margin: 34px 0 10px; color: #fff; font: 400 clamp(40px, 8vw, 58px)/1.02 var(--serif); letter-spacing: -0.02em; text-shadow: 0 2px 30px rgba(10, 40, 90, 0.25); }
    h1 em { color: #0c1a30; font-style: italic; }
    .sub { margin: 0 auto 28px; max-width: 420px; color: rgba(255,255,255,0.9); font-size: 17px; }
    .card {
      text-align: left; background: rgba(255,255,255,0.92); border: 1px solid rgba(255,255,255,0.7); border-radius: 22px;
      padding: 24px; box-shadow: 0 30px 70px -24px rgba(8, 36, 80, 0.45), 0 1px 0 rgba(255,255,255,0.8) inset;
      -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
      animation: rise 700ms var(--ease) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } }
    .q { margin: 0 0 14px; font-weight: 600; font-size: 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; border: 0; padding: 0; margin: 0; }
    .chip { position: relative; }
    .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .chip span {
      display: inline-flex; align-items: center; min-height: 42px; padding: 0 15px; border-radius: 999px; cursor: pointer;
      background: #fff; border: 1px solid var(--line); color: var(--ink); font-size: 14.5px; font-weight: 500;
      transition: background 180ms var(--ease), border-color 180ms var(--ease), color 180ms var(--ease), transform 180ms var(--ease);
    }
    .chip span:hover { border-color: rgba(47, 127, 214, 0.45); }
    .chip input:checked + span { background: #0c1a30; border-color: #0c1a30; color: #fff; }
    .chip input:focus-visible + span { outline: 2px solid #2f7fd6; outline-offset: 2px; }
    label.note { display: block; margin: 20px 0 8px; font-weight: 600; font-size: 15px; }
    label.note small { color: var(--muted); font-weight: 400; }
    textarea {
      width: 100%; min-height: 96px; resize: vertical; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
      font: 15px/1.5 var(--sans); color: var(--ink); background: #fff;
    }
    textarea:focus { outline: 2px solid rgba(47, 127, 214, 0.5); outline-offset: 1px; border-color: transparent; }
    .submit {
      margin-top: 18px; width: 100%; height: 52px; border: 0; border-radius: 999px; cursor: pointer;
      background: #07090d; color: #fff; font: 600 16px/1 var(--sans);
      box-shadow: 0 1px 0 rgba(255,255,255,0.14) inset, 0 12px 28px -8px rgba(5, 20, 50, 0.5);
      transition: transform 180ms var(--ease), opacity 180ms;
    }
    .submit:hover { transform: translateY(-1px); }
    .submit:disabled { opacity: 0.5; cursor: default; transform: none; }
    .err { margin: 12px 0 0; color: #b42318; font-size: 14px; min-height: 0; }
    .thanks { text-align: center; padding: 10px 6px 4px; }
    .thanks .check { width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; background: #e7f6ed; color: #1a8f4e; }
    .thanks h2 { margin: 0 0 6px; font: 400 32px/1.1 var(--serif); }
    .thanks p { margin: 0 0 18px; color: var(--muted); }
    .thanks a { display: inline-flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 600; }
    .hp { position: absolute; left: -9999px; }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  </style>
</head>
<body>
  <div class="rays" aria-hidden="true"></div>
  <div class="mountains" aria-hidden="true">
    <img class="far" src="/assets/scene/far.svg" alt="" />
    <img class="mid" src="/assets/scene/mid.svg" alt="" />
    <img class="near" src="/assets/scene/near.svg" alt="" />
  </div>

  <main>
    <a class="brand" href="/"><img src="/assets/icons/favicon.svg" alt="" />Nook</a>
    <h1>Sorry to see <em>you go.</em></h1>
    <p class="sub">Nook is uninstalled. One quick question so we can make it better:</p>

    <div class="card" id="card">
      <form id="form" novalidate>
        <p class="q" id="q">Why did you uninstall Nook?</p>
        <fieldset class="chips" aria-labelledby="q">
          <label class="chip"><input type="radio" name="reason" value="Wrong answers" /><span>Wrong answers</span></label>
          <label class="chip"><input type="radio" name="reason" value="Too slow" /><span>Too slow</span></label>
          <label class="chip"><input type="radio" name="reason" value="Didn't work on my site" /><span>Didn't work on my site</span></label>
          <label class="chip"><input type="radio" name="reason" value="Gemini sign-in trouble" /><span>Gemini sign-in trouble</span></label>
          <label class="chip"><input type="radio" name="reason" value="The sidebar gets in the way" /><span>The sidebar gets in the way</span></label>
          <label class="chip"><input type="radio" name="reason" value="Don't need it anymore" /><span>Don't need it anymore</span></label>
          <label class="chip"><input type="radio" name="reason" value="Other" /><span>Other</span></label>
        </fieldset>
        <label class="note" for="details">Anything else? <small>(optional)</small></label>
        <textarea id="details" name="details" maxlength="2000" placeholder="What went wrong, or what would have made you keep it?"></textarea>
        <input class="hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" />
        <button class="submit" id="submit" type="submit">Submit</button>
        <p class="err" id="err" role="alert"></p>
      </form>
    </div>
  </main>

  <script>
    (() => {
      // Web3Forms access keys are public by design: they only let this form send to the owner's inbox.
      const ACCESS_KEY = "8516dc2d-f2e0-44ad-9c7b-40d011d26f7a";
      const STORE = "https://chromewebstore.google.com/detail/nook-ai-answering-sidebar/fpoojjlpjldmeamnjhbmkkokjlfhdelc";
      const version = new URLSearchParams(location.search).get("v") || "unknown";
      const form = document.getElementById("form"), btn = document.getElementById("submit"), err = document.getElementById("err");


      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const reason = form.querySelector('input[name="reason"]:checked')?.value;
        if (!reason) { err.textContent = "Pick the reason that fits best."; return; }
        if (form.botcheck.checked) return;
        err.textContent = "";
        btn.disabled = true;
        btn.textContent = "Sending…";
        try {
          const res = await fetch("https://api.web3forms.com/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({
              access_key: ACCESS_KEY,
              subject: `Nook uninstall: ${reason}`,
              from_name: "Nook uninstall feedback",
              reason,
              details: form.details.value.trim() || "(none)",
              extension_version: version,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.success === false) throw new Error(data.message || "Couldn't send.");
          document.getElementById("card").innerHTML =
            `<div class="thanks"><div class="check"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>` +
            `<h2>Thank you.</h2><p>We read every answer and use it to make Nook better.</p>` +
            `<a href="${STORE}" target="_blank" rel="noopener">Changed your mind? Reinstall Nook</a></div>`;
        } catch (e) {
          btn.disabled = false;
          btn.textContent = "Submit";
          err.textContent = "Couldn't send that. Check your connection and try again.";
        }
      });
    })();
  </script>
  <script src="/assets/track.js"></script>
</body>
</html>
